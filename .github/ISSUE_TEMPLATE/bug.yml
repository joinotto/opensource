name: Bug report
description: Report a reproducible non-sensitive problem
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private files, or sensitive vulnerability details. Use the private reporting route in SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the CLI version, OS, Node version, profile, and a minimal configuration with fictional public values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
