name: Stage npm release
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Full main commit SHA reviewed for version 0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: opensource-npm-stage
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.NPM_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed source
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: test "$REVIEWED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node scripts/pack-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-opensource
          path: |
            .opensource/release/ottoai-opensource-0.1.0.tgz
            .opensource/release/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  stage:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-opensource
          path: reviewed
      - name: Verify archive and stage only
        working-directory: reviewed
        run: |
          sha256sum --check SHA256SUMS
          npm stage publish ./ottoai-opensource-0.1.0.tgz --access public --tag latest --ignore-scripts --provenance
